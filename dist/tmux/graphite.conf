# Generated by scripts/build.ts from palette.json. Do not edit by hand.
# Requires tmux >= 3.0 (variables) and a Powerline/Nerd Font for the glyphs.

primary="#96b2d7"
bg="#101114"
bg_light="#2c2e31"
bg_select="#394454"

text_color_primary="#96b2d7"
text_color_light="#d2d4d9"
text_color_dark="#17191d"

active_pane_border_color="#96b2d7"
inactive_pane_border_color="#394454"
active_pane_bg="#17191d"
inactive_pane_bg="#131518"
inactive_pane_text_color="#98999b"

# Copy mode
set -g mode-style "fg=${text_color_light},bg=${bg_select}"

# Messages
set -g message-style "fg=${text_color_primary},bg=${bg_light},fill=${bg_light}"
set -g message-command-style "fg=${text_color_primary},bg=${bg_light},fill=${bg_light}"

# Panes
set -g pane-border-style "fg=${inactive_pane_border_color}"
set -g pane-active-border-style "fg=${active_pane_border_color}"
set-window-option -g window-style "fg=${inactive_pane_text_color},bg=${inactive_pane_bg}"
set-window-option -g window-active-style "fg=${text_color_light},bg=${active_pane_bg}"

# Status bar
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=${text_color_primary},bg=${bg}"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=${text_color_dark},bg=${primary},bold]  #S #{?#{!=:#{window_panes},1},   #P,} #[fg=${primary},bg=${bg},nobold,nounderscore,noitalics]"
set -g status-right "#[fg=${bg_light},bg=${bg},nobold,nounderscore,noitalics]#[fg=${text_color_primary},bg=${bg_light}] %a %H:%M #[fg=${primary},bg=${bg_light},nobold,nounderscore,noitalics]#[fg=${text_color_dark},bg=${primary},bold] %Y-%m-%d "

setw -g window-status-activity-style "underscore,fg=${text_color_light},bg=${bg}"
setw -g window-status-style "NONE,fg=${text_color_light},bg=${bg}"
setw -g window-status-separator ""
setw -g window-status-format "#[fg=${bg},bg=${bg},nobold,nounderscore,noitalics]#[default] #I:#W "
setw -g window-status-current-format "#[fg=${bg},bg=${bg_light},nobold,nounderscore,noitalics]#[fg=${text_color_primary},bg=${bg_light},bold] #I:#W #[fg=${bg_light},bg=${bg},nobold,nounderscore,noitalics]"
